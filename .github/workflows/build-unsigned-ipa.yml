name: build-unsigned-ipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26 (SDK 26.x — newest available; Xcode 27 not on runners yet)
        run: |
          XCODE_DIR="$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)"
          echo "Selected: $XCODE_DIR"
          sudo xcode-select -s "$XCODE_DIR/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep -m5 iPhone || true

      - name: Run unit tests (iOS Simulator)
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/run-tests.sh

      - name: Build unsigned IPA
        run: ./Scripts/build.sh

      - name: Verify IPA
        run: ./Scripts/verify_ipa.sh build/AirLiftFileManager-unsigned.ipa

      - name: Generate diagnostic report
        run: ./Scripts/diagnostic_report.sh build/DIAGNOSTIC_REPORT.md

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirLiftFileManager-unsigned
          path: build/AirLiftFileManager-unsigned.ipa

      - name: Upload diagnostic report artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-report
          path: build/DIAGNOSTIC_REPORT.md
